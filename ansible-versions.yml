---
################################################
# Ansible Versions
################################################
ansible_variations:
  - name: "ansible-core"
    versions:
      - version: "2.21"
        latest_stable: true
        python_versions:
          - "3.14"
          - "3.13"
          - "3.12"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
      - version: "2.20"
        python_versions:
          - "3.14"
          - "3.13"
          - "3.12"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
      - version: "2.19"
        python_versions:
          - "3.13"
          - "3.12"
          - "3.11"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie

  - name: "ansible"
    latest_stable: true
    versions:
      - version: "14"
        latest_stable: true
        python_versions:
          - "3.14"
          - "3.13"
          - "3.12"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
      - version: "13"
        python_versions:
          - "3.14"
          - "3.13"
          - "3.12"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie
      - version: "12"
        python_versions:
          - "3.13"
          - "3.12"
          - "3.11"
        base_os:
          - name: alpine3.23
          - name: alpine3.24
          - name: bookworm
          - name: trixie

################################################
# Python Versions
################################################
python_versions:
  - name: "3.14"
    latest_stable: true
  - name: "3.13"
  - name: "3.12"
  - name: "3.11"

################################################
# Operating System Distributions
################################################
operating_system_distributions:
  - name: "debian"
    latest_stable: true
    versions:
      - name: "bookworm"
        package_dependencies:
          - "git"
          - "gosu"
          - "jq"
          - "less"
          - "libffi-dev"
          - "libhdf5-dev"
          - "libssl-dev"
          - "openssh-client"
          - "sshpass"
      - name: "trixie"
        latest_stable: true
        package_dependencies:
          - "git"
          - "gosu"
          - "jq"
          - "less"
          - "libffi-dev"
          - "libhdf5-dev"
          - "libssl-dev"
          - "openssh-client"
          - "sshpass"
  - name: "alpine"
    versions:
      - name: "alpine3.23"
        package_dependencies:
          - "build-base"
          - "git"
          - "libffi-dev"
          - "jq"
          - "openssh-client"
          - "openssl-dev"
          - "rsync"
          - "shadow"
          - "sshpass"
          - "su-exec"
      - name: "alpine3.24"
        latest_stable: true
        package_dependencies:
          - "build-base"
          - "git"
          - "libffi-dev"
          - "jq"
          - "openssh-client"
          - "openssl-dev"
          - "rsync"
          - "shadow"
          - "sshpass"
          - "su-exec"
